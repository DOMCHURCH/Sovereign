services:
  - type: web
    name: sovereign-api
    runtime: python
    rootDir: api
    buildCommand: >
      pip install -r requirements.txt &&
      python -m textblob.download_corpora
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CEREBRAS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /data/sovereign.duckdb
    disk:
      name: sovereign-db
      mountPath: /data
      sizeGB: 1
