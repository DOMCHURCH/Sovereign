name: Refresh risk snapshot

# Vercel's filesystem is ephemeral, so the API cannot refresh its own DuckDB file (see
# api/refresh_data.py). This job runs the ingest + analytics pipeline against live
# sources, commits the rebuilt snapshot, and lets the push trigger a Vercel redeploy.
#
# Running daily also backfills the history that delta_7d and the 90-day country chart
# read from — those stay at zero for as long as there is only one snapshot in the file.

on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC daily, off the hour to dodge peak API contention
  workflow_dispatch:        # manual "Run workflow" button

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Rebuild snapshot from live sources
        env:
          NEWS_API_KEYS: ${{ secrets.NEWS_API_KEYS }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python api/refresh_data.py

      - name: Commit the refreshed snapshot
        run: |
          if git diff --quiet -- api/sovereign_seed.duckdb; then
            echo "snapshot unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "sovereign-refresh[bot]"
          git config user.email "sovereign-refresh@users.noreply.github.com"
          git add api/sovereign_seed.duckdb
          git commit -m "chore: refresh risk snapshot ($(date -u +%Y-%m-%d))"
          git push
